[workspace]
members = ["crates/nacre-helper", "crates/nacre-protocol", "crates/nacre-menu", "crates/nacre-i18n"]
exclude = ["deps/orient", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.2"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "signal", "macros", "process"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Match the Bead services pin: its task accounting requires this upstream fix.
[patch.crates-io]
system-tray = { git = "https://github.com/nacre-desktop/bead.git", rev = "a6d423382b0fb322419646d1fbb70b543e2780cd" }
