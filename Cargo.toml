[workspace]
members = ["crates/nacre-helper"]
exclude = ["deps/orient"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
