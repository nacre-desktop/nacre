name: Source checks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: nice -n 10 bash --noprofile --norc -e -o pipefail {0}
permissions:
  contents: read
jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.NACRE_CI_RUNNER || '["self-hosted","linux","nacre-ci"]') }}
    env:
      # Hosted runners have about 14 GB free; incremental state and full debuginfo overflow it.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    container:
      image: ghcr.io/archlinux/archlinux:latest
      # Bubblewrap supplies an inner disposable filesystem/user namespace.
      # Arch Sway carries cap_sys_nice; its private video smoke needs that
      # capability in the container bounding set to execute the packaged binary.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --cap-add=SYS_NICE --tmpfs /tmp:rw,exec,nosuid,size=4g ${{ !contains(vars.NACRE_CI_RUNNER, 'ubuntu-') && '--cpus=10 --memory=28g' || '' }}
    steps:
      - name: Rolling package cache key
        id: cache_epoch
        run: printf 'week=%s\n' "$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Arch packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-pacman-${{ runner.arch }}-${{ steps.cache_epoch.outputs.week }}
          restore-keys: arch-pacman-${{ runner.arch }}-
      - name: Install target-platform checks
        run: pacman -Syu --noconfirm --needed git curl unzip python python-pip python-pillow ruff lua fish qt6-declarative qt6-imageformats gcc pkgconf rust clang libpipewire mpv lcms2 cmake make gtk3 librsvg kconfig kcolorscheme breeze nodejs npm jq xorg-server-xvfb xorg-xauth kitty less mesa dbus ttf-dejavu niri sway swaybg grim fastfetch ffmpeg curl unzip gdk-pixbuf2 fontconfig libxkbcommon wayland
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Restore public checkout modes
        run: python tools/ci_public_checkout.py
      - name: Tool cache identity
        id: tools
        run: |
          printf 'python=%s\n' "$(python -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"
          printf 'rust=%s\n' "$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore check environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/check-env
          key: arch-venv-${{ runner.arch }}-${{ steps.tools.outputs.python }}-${{ hashFiles('dependencies.lock.json', 'nacre/shell-cli/**', 'ruff.toml') }}
      - name: Restore Cargo downloads and builds
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            deps/orient/target
            target
          key: arch-cargo-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ hashFiles('dependencies.lock.json', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
          restore-keys: arch-cargo-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-
      - name: Restore npm downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: arch-npm-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the pinned palette engine in an isolated environment
        run: |
          cargo build -j2 --release --locked --manifest-path deps/orient/Cargo.toml -p orient-cli
          python -m venv /tmp/check-env
          python - <<'PY'
          import json, subprocess
          pins = json.load(open("dependencies.lock.json"))["python"]
          subprocess.run(["/tmp/check-env/bin/pip", "install", "./nacre/shell-cli", "ruff==0.16.10", "dbus-next==0.2.3", *[name + "==" + version for name, version in pins.items()]], check=True)
          PY
      - name: Candidate engine for package setup tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-engine
          path: deps/orient/target/release/orient
          retention-days: 3
      - name: Native helper library checks
        env:
          BEAD_TEST_ARTIFACTS: ${{ runner.temp }}/bead-headless
          RUST_TEST_THREADS: 2
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -j2 -- -D warnings
          cargo build -j2 --locked --examples
          cargo test --workspace --locked -j2
          cargo run -j2 --locked --manifest-path crates/nacre-protocol/tests/minimal-consumer/Cargo.toml --target-dir target
          cargo build -j2 --locked --release -p nacre-helper --bin nacre-helper
      - name: Imported product shell Rust checks
        run: |
          cargo test -p nacre-shell --features trace --locked -j2 memory_policy::tests::
          cargo check -p nacre-shell --no-default-features --locked -j2
          cargo check --workspace --all-features --locked -j2
          cargo build -p nacre-shell --bin nacre-shell --no-default-features --locked -j2
          cargo build -p nacre-shell --bin bead-wallpaper-video --locked -j2
          cargo build -p nacre-shell --bin nacre-wallpaper-decode --locked -j2
      - name: Imported product shell golden artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bead-product-headless-diffs
          path: ${{ runner.temp }}/bead-headless
          if-no-files-found: ignore
      - name: Build pinned Luau analyzer
        run: python tools/check_product_shell.py --download-analyzer "$RUNNER_TEMP/luau/luau-analyze"
      - name: Product shell, Luau and wallpaper checks
        run: python tools/check_product_shell.py --analyzer "$RUNNER_TEMP/luau/luau-analyze"
      - name: Install pinned cargo-deny for product graph
        run: |
          asset=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          base=https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2
          curl -fsSL "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$base/$asset.sha256" -o "$RUNNER_TEMP/deny.sha256"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$(cat deny.sha256)" "$asset" | sha256sum -c -
          tar -xzf "$asset"
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$RUNNER_TEMP/${asset%.tar.gz}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Product dependency and license graph
        run: cargo deny --manifest-path crates/nacre-shell/Cargo.toml --all-features --config crates/nacre-shell/deny.toml check
      - name: Candidate helper for package setup tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-helper
          path: target/release/nacre-helper
          retention-days: 3
      - name: Install development-only JavaScript formatter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Translation coverage
        run: |
          /tmp/check-env/bin/python tools/i18n/check.py
          /tmp/check-env/bin/python tools/i18n/generate.py
      - name: Source and native UI regression checks
        run: |
          export NACRE_ORIENT_BINARY="$PWD/deps/orient/target/release/orient"
          export NACRE_HELPER_BINARY="$PWD/target/release/nacre-helper"
          dbus-run-session -- xvfb-run -a /tmp/check-env/bin/python tools/check.py
      - name: Native AUR review gallery
        run: NACRE_HELPER_BINARY="$PWD/target/release/nacre-helper" /tmp/check-env/bin/python tools/capture-aur-review.py --output /tmp/nacre-aur-review
      - name: Daemon raster memory regression
        run: |
          NACRE_MEMORY_BINARY="$PWD/target/release/nacre-helper" cargo test -j2 --locked -p nacre-helper --test daemon memory:: -- --ignored --nocapture
      - name: Native gallery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-gallery
          path: /tmp/nacre-aur-review
          retention-days: 7
      - name: Save Arch packages
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /var/cache/pacman/pkg
          key: arch-pacman-${{ runner.arch }}-${{ steps.cache_epoch.outputs.week }}
      - name: Save check environment
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/check-env
          key: arch-venv-${{ runner.arch }}-${{ steps.tools.outputs.python }}-${{ hashFiles('dependencies.lock.json', 'nacre/shell-cli/**', 'ruff.toml') }}
      - name: Save Cargo downloads and builds
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            deps/orient/target
            target
          key: arch-cargo-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ hashFiles('dependencies.lock.json', 'Cargo.lock', 'Cargo.toml', 'crates/**') }}
      - name: Save npm downloads
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.npm
          key: arch-npm-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
  package-stage-install:
    if: ${{ github.ref == 'refs/heads/main' && needs.desktop.result == 'success' }}
    needs: desktop
    runs-on: ${{ fromJSON(vars.NACRE_CI_RUNNER || '["self-hosted","linux","nacre-ci"]') }}
    container:
      image: ghcr.io/archlinux/archlinux:latest
      options: ${{ !contains(vars.NACRE_CI_RUNNER, 'ubuntu-') && '--cpus=10 --memory=28g' || '' }}
    timeout-minutes: 10
    steps:
      - name: Install package-test runtime
        run: pacman -Syu --noconfirm --needed git python python-pillow python-yaml python-gobject python-dbus python-dbus-next python-jsonschema libpipewire mpv fontconfig freetype2 libraqm libjpeg-turbo lcms2 librsvg glib2 libxkbcommon gdk-pixbuf2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Download candidate engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-engine
          path: deps/orient/target/release
      - name: Download candidate helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-helper
          path: target/release
      - name: Run isolated package staging and install tests
        env:
          NACRE_HELPER_BINARY: ${{ github.workspace }}/target/release/nacre-helper
          NACRE_ORIENT_BINARY: ${{ github.workspace }}/deps/orient/target/release/orient
          PYTHONPATH: ${{ github.workspace }}/tools/tests:${{ github.workspace }}/nacre/shell-tools:${{ github.workspace }}/nacre/shell-cli/src
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/deps/orient"
          chmod +x "$NACRE_HELPER_BINARY" "$NACRE_ORIENT_BINARY"
          python -m unittest \
            test_setup.PackageSetupTests.test_apply_is_offline_repeatable_preserves_private_state_and_rolls_back \
            test_setup.ArchPackageLayoutTests.test_split_packages_have_no_file_collisions_and_ship_native_artifacts
