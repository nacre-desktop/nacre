name: Headless shell performance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reference_revision:
        description: Optional ancestor commit for a sequential before/after capture
        type: string
        default: ""
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/archlinux/archlinux:latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install disposable software-rendered session tools
        run: pacman -Syu --noconfirm --needed git python python-pillow quickshell qt6-wayland qt6-multimedia qt6-multimedia-ffmpeg qt6-imageformats labwc wlr-randr wtype niri mesa dbus ffmpeg ttf-dejavu gcc pkgconf rust lcms2 cmake make
      - name: Build the pinned engine for public color fixtures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo build --release --locked --manifest-path deps/orient/Cargo.toml -p orient-cli
      - name: Measure the reference in the same disposable runner
        if: github.event_name == 'workflow_dispatch' && inputs.reference_revision != ''
        env:
          REFERENCE_REVISION: ${{ inputs.reference_revision }}
        run: |
          reference=$(git rev-parse --verify --end-of-options "${REFERENCE_REVISION}^{commit}")
          python tools/performance-session.py --backend niri --parent-renderer pixman --budget-tier software --orient-binary deps/orient/target/release/orient --revision "$reference" --quick --repeats 5 --idle-seconds 15 --check-budgets --output /tmp/performance-niri-before.json
      - name: Measure shell memory and key event to complete frame
        run: python tools/performance-session.py --backend niri --parent-renderer pixman --budget-tier software --orient-binary deps/orient/target/release/orient --quick --repeats 5 --idle-seconds 15 --check-budgets --output /tmp/performance-niri.json
      - name: Preserve measured distributions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-performance-niri
          path: /tmp/performance-niri*.json
          if-no-files-found: error
