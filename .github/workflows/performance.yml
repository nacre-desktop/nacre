name: Headless shell performance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/archlinux/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        backend: [hyprland, niri]
    steps:
      - name: Install disposable performance session tools
        run: pacman -Syu --noconfirm --needed git python python-pillow quickshell qt6-wayland qt6-multimedia qt6-multimedia-ffmpeg qt6-imageformats labwc wlr-randr wtype hyprland niri mesa dbus ffmpeg ttf-dejavu gcc pkgconf rust lcms2 cmake make
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Build the pinned engine for public color fixtures
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo build --release --locked --manifest-path deps/orient/Cargo.toml -p orient-cli
      - name: Measure shell memory and key event to complete frame
        run: |
          python tools/performance-session.py --backend ${{ matrix.backend }} --orient-binary deps/orient/target/release/orient --quick --repeats 5 --idle-seconds 15 --check-budgets --output /tmp/performance-${{ matrix.backend }}.json
      - name: Preserve measured distributions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-performance-${{ matrix.backend }}
          path: /tmp/performance-${{ matrix.backend }}.json
          if-no-files-found: error
