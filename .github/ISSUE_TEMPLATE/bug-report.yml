name: Bug report
description: Report a reproducible Nacre problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value:
        For suspected vulnerabilities, use [private reporting](https://github.com/nacre-desktop/nacre/security/advisories/new),
        not a public issue. See [SECURITY.md](https://github.com/nacre-desktop/nacre/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe one problem and when it started.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description:
        Number the steps, including the exact command or UI action. Use public demo data when
        possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens? Include error messages and relevant sanitized logs.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: nacre doctor --report output
      description:
        Run nacre doctor --report and paste the output after reviewing it for private information.
        If your version lacks this command, paste its error, your Nacre version/commit, and the output of
        nacre-maintenance state from your source checkout. Do not run recovery actions
        for this report.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Session and environment
      description:
        Distribution/version, Nacre version/commit, compositor/version, Quickshell and Qt versions,
        GPU/driver, display layout/scaling, and installation method/profile. Mention optional AI/Brain components
        without sharing personal profile files.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or additional evidence
      description:
        "Optional: use public demo data and remove private paths, usernames, account details,
        notifications and image metadata."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label:
            I checked existing issues and removed credentials, account data and other private information
            from this report.
          required: true
