name: Hardware compatibility report
description: Share tested Nacre compatibility and device-specific problems.
title: "[Hardware]: "
labels:
  - hardware
body:
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and software
      description:
        Device/model, CPU architecture, GPU and driver, distribution/kernel, compositor/version,
        Quickshell/Qt, displays/scaling, and power source. Omit serial numbers and unique device identifiers.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Nacre version and installation
      description: Version/commit, installation method and any relevant non-private configuration.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or commands tested
      description: Describe a repeatable test, relevant settings and the session or device actions tested.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should work on this hardware?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and compatibility
      description:
        State what works, what fails and what remains untested. Include sanitized errors or measurements
        with units and measurement method.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: nacre doctor --report output
      description:
        Paste reviewed, sanitized output. If unavailable on your version, paste the command error,
        Nacre version/commit, and python3 nacre/shell-tools/maintenance.py state output from the source
        checkout.
      render: text
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workarounds and limitations
      description:
        "Optional: safe changes tried and their result. Do not disable protection or upload private
        settings."
    validations:
      required: false
