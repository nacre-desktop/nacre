[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nacre_shell"
requires-python = ">=3.13"
version = "0.1.0.dev2"
description = "Nacre desktop adapter for the standalone Orient engine"
dependencies = ["pillow>=11,<13"]

[project.scripts]
nacre_shell = "nacre_shell:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nacre_shell"]

[tool.ruff]
extend = "../../ruff.toml"
line-length = 120

# The standalone guard also ships with the palette adapter; source stays shared.
[tool.hatch.build.targets.wheel.force-include]
"../shell-tools/nacre_state.py" = "nacre_state.py"
"../shell-tools/nacre-state-files.json" = "nacre-state-files.json"
