[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nacre_shell"
requires-python = ">=3.13"
version = "0.1.0.dev2"
description = "Orient: Nacre's independent wallpaper palette engine"
dependencies = ["orient-colors==0.1.0.dev4"]

[project.scripts]
nacre_shell = "nacre_shell:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nacre_shell"]

[tool.ruff]
extend = "../../ruff.toml"
line-length = 120
