# Nacre terminal: small static defaults, with private live colours and overrides.
font_family JetBrainsMono Nerd Font
font_size 12
bold_font auto
italic_font auto
bold_italic_font auto

# Predictable standalone size; Hyprland still controls tiling.
remember_window_size no
initial_window_width 950
initial_window_height 500
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1
enable_audio_bell no
cursor_blink_interval 0.5
cursor_stop_blinking_after 1
cursor_trail 1

# The palette publisher owns wallpaper-tinted colours and subtle transparency.
background_opacity 0.92
dynamic_background_opacity yes
selection_foreground none
selection_background none
include $HOME/.config/nacre/kitty-colors.conf

# Optional host adjustments are private and take precedence.
globinclude custom.conf
