# Managed sleep hooks, with private and Settings idle listeners.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/hyprctl-lua.sh dpms enable
}
source = ~/.config/nacre/hypridle.local.conf
source = ~/.config/nacre/power-idle.conf
