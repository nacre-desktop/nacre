[package]
name = "nacre-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nacre-protocol = { path = "../nacre-protocol" }
nacre-menu = { path = "../nacre-menu" }
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
listenfd = "1"
orient-core = { path = "../../deps/orient/crates/orient-core" }
orient-decoder = { path = "../../deps/orient/crates/orient-decoder" }
serde.workspace = true
serde_json.workspace = true
base64 = "=0.23.1"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
tempfile = "3"
regex = "1"
nix = { version = "0.30", features = ["fs", "user", "signal", "feature", "socket"] }
chrono = "0.4"
chrono-tz = "0.10"
walkdir = "2"
wait-timeout = "0.2"
zbus = { version = "5", features = ["blocking-api", "tokio"] }
zvariant = { version = "5", features = ["gvariant"] }
async-io = "2"
futures-lite = "2"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "=0.1.24"
unicode-casefold = "0.2"
unicode-general-category = "=1.1.0"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
nvml-wrapper = "0.13"
rustix = { version = "1.1", features = ["fs", "param", "process", "event", "system", "termios", "pty"] }
niri-ipc = "26.4.0"
fancy-regex = "0.16"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "=0.13.2", default-features = false }
roxmltree = "=0.21.1"
fontconfig = "=0.11.0"
freetype-rs = "=0.38.0"
html-escape = "=0.2.13"
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }
gif = "0.14"
include_dir = "0.7"

[dev-dependencies]
flate2 = "1"
tokio = { workspace = true, features = ["test-util"] }
